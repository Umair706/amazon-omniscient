services:
  backend:
    build: ./backend
    mem_limit: 1500m
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://omniscient:password@db:5432/omniscient
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - OPENAI_BASE_URL=http://host.docker.internal:11434/v1
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
      - ALLOWED_ORIGINS=http://localhost:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Migrations run here, before the API starts. The worker and beat wait for this
    # container to be healthy, so no task can run against tables that do not exist yet.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  celery-worker:
    build: ./backend
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://omniscient:password@db:5432/omniscient
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - OPENAI_BASE_URL=http://host.docker.internal:11434/v1
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    # Concurrency is memory-bound: each analysis opens a headless Chromium (~0.5-1GB).
    # Default 2 keeps peak memory sane on a modest machine; raise CELERY_CONCURRENCY
    # if you have the RAM. mem_limit caps a runaway so it fails the container
    # instead of exhausting the host and crashing the WSL VM.
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2} -Q default,analysis,tracking,scraping
    mem_limit: 4g
    volumes:
      - ./backend:/app
      - cookie_data:/app/data/cookies
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --timeout 10 2>/dev/null | grep -q OK || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3

  celery-beat:
    build: ./backend
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://omniscient:password@db:5432/omniscient
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - OPENAI_BASE_URL=http://host.docker.internal:11434/v1
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: celery -A app.workers.celery_app beat --loglevel=info --pidfile=/tmp/celerybeat.pid
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $(cat /tmp/celerybeat.pid) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    mem_limit: 1g
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - INTERNAL_API_URL=http://backend:8000

  db:
    image: timescale/timescaledb:latest-pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: omniscient
      POSTGRES_USER: omniscient
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniscient"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Free, local LLM so a seller can test the AI features without any API key.
  # Opt-in (it is a large image): start it with `docker compose --profile llm up -d ollama`,
  # then pull a model: `docker compose exec ollama ollama pull qwen2.5:3b`.
  # In Settings, choose "Ollama (Local)" and set the model to what you pulled.
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  # Hosted MCP endpoint so a remote LLM agent can use Omniscient as a toolbox.
  # Opt-in: `docker compose --profile mcp up -d mcp`. Set MCP_AUTH_TOKEN in .env
  # to require a bearer token. Connect an SSE MCP client to http://<host>:8765/sse.
  mcp:
    build: ./backend
    profiles: ["mcp"]
    mem_limit: 768m
    command: python -m app.mcp_server
    environment:
      - MCP_TRANSPORT=sse
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8765
      - OMNISCIENT_API_URL=http://backend:8000
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
    ports:
      - "8765:8765"
    # Mount the source so the MCP server runs current code, like the backend.
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  cookie_data:
  ollama_models:
