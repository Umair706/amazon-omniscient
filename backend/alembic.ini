# Alembic configuration for Project Omniscient
# ──────────────────────────────────────────────

[alembic]
# Path to the migration scripts directory
script_location = migrations

# Template used to generate migration file names
# Uses "001", "002", etc. style numbering via file_template
file_template = %%(rev)s_%%(slug)s

# sys.path prepend – ensures `app` package is importable
prepend_sys_path = .

# Timezone for rendered dates in migration files
# timezone =

# Maximum length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision'
# command, regardless of autogenerate
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source
# .py file to be detected as revisions in the versions/ directory
# sourceless = false

# Version number separator; by default "__", to separate the
# two-digit revision number from the rest of the slug
# version_path_separator = os

# sqlalchemy.url is intentionally left as a placeholder here.
# The actual database URL is loaded at runtime by env.py from
# app.config.Settings (environment variable DATABASE_URL).
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# Uncomment to run black on new migration files
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q


# ── Logging ──────────────────────────────────────────────────────

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
