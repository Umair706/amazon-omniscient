[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omniscient"
version = "0.1.0"
description = "Amazon Product Research Engine"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",

    # Database
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.9",

    # Cache & Queue
    "redis>=5.2.0",
    "celery[redis]>=5.4.0",

    # LLM Providers
    "openai>=1.55.0",
    "anthropic>=0.39.0",
    "dashscope>=1.20.0",

    # Amazon APIs
    "python-amazon-sp-api>=0.3.7",
    "httpx>=0.28.0",

    # Scraping
    "playwright>=1.49.0",

    # Security
    "cryptography>=44.0.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",

    # Utilities
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "fakeredis>=2.25.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
